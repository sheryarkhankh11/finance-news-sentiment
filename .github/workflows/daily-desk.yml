name: daily-desk
# Optional: fetch live headlines and publish the sentiment report as a build artifact.
# The API key lives ONLY in repo Settings -> Secrets -> Actions (FINNHUB_API_KEY).
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

jobs:
  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scikit-learn matplotlib PyYAML requests
      - uses: actions/cache@v4            # keep API responses between runs
        with:
          path: .cache/api
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-
      - name: Train on the sample set, fetch live news, build report
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PYTHONPATH: src
        run: |
          python -m fnsd.cli train --model bilstm
          python -m fnsd.cli fetch --source finnhub --days 3
          python -m fnsd.cli desk --model bilstm --input "$(ls -t data/live/*.csv | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: desk-report
          path: reports/
