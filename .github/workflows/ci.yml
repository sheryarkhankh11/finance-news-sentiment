name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scikit-learn matplotlib PyYAML requests pytest
      - name: Unit tests (no network, no secrets needed)
        run: pytest -q
      - name: Smoke run on the bundled synthetic sample
        run: |
          PYTHONPATH=src python -m fnsd.cli train --model tfidf
          PYTHONPATH=src python -m fnsd.cli train --model bilstm
          PYTHONPATH=src python -m fnsd.cli desk --model bilstm
